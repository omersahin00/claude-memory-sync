name: Release

# Pushing a version tag (vX.Y.Z, the version in package.json) builds the installers on GitHub's macOS and
# Windows runners and publishes them as a GitHub release. Run it by hand to rebuild an existing tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, e.g. v2.0.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check that the tag matches package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then echo "Tag $TAG does not match package.json version $version"; exit 1; fi
      - run: npm ci --no-audit --no-fund
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Claude Memory Sync ${{ env.TAG }}
          files: installers/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            | System | Installer |
            |---|---|
            | macOS, Apple Silicon | `Claude-Memory-Sync-${{ env.VERSION }}-arm64.dmg` |
            | macOS, Intel | `Claude-Memory-Sync-${{ env.VERSION }}-x64.dmg` |
            | Windows | `Claude-Memory-Sync-Setup-${{ env.VERSION }}.exe` |

            The installers are not code-signed. On macOS, the first launch has to be allowed in System Settings → Privacy & Security → Open Anyway. On Windows, choose More info → Run anyway in the SmartScreen dialog.
