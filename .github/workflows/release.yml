name: Release

# Pushing a version tag (vX.Y.Z, the version in package.json) builds the installers on GitHub's macOS and
# Windows runners and publishes them as a GitHub release. Run it by hand to rebuild an existing tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, e.g. v2.0.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check that the tag matches package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then echo "Tag $TAG does not match package.json version $version"; exit 1; fi
      - run: npm ci --no-audit --no-fund
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      # The download table at the top of the release page, with a direct link to each installer. A missing installer
      # fails the run here, before anything is published.
      - name: Write the release notes
        env:
          BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.TAG }}
        run: |
          version="${TAG#v}"
          row() {
            file="Claude-Memory-Sync-$1-$version.$2"
            [ -f "installers/$file" ] || { echo "Missing installer: $file"; exit 1; }
            echo "| $3 | [$file]($BASE/$file) |"
          }
          {
            echo "## Download"
            echo
            echo "| System | Installer |"
            echo "|---|---|"
            row macOS-Apple-Silicon dmg "**macOS** · Apple Silicon (M1 or later)"
            row macOS-Intel dmg "**macOS** · Intel"
            row Windows-Setup exe "**Windows** · 64-bit"
            echo
            echo 'Not sure which Mac you have? In the Apple menu, choose About This Mac: "Chip: Apple M…" is Apple Silicon, "Processor: Intel" is Intel.'
            echo
            echo "The installers are not code-signed. On macOS, the first launch has to be allowed in System Settings → Privacy & Security → Open Anyway. On Windows, choose More info → Run anyway in the SmartScreen dialog."
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Claude Memory Sync ${{ env.TAG }}
          files: installers/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: notes.md
