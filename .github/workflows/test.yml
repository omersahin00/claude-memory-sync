# The tests on macOS and on Windows, at every push to main. Windows is checked only here: there is no Windows computer
# where the app is made. The backups' tests (test/backups.test.js) run the real restic.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # The tests do not start Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # npm test, in two steps: failing tests also become annotations (scripts/github-annotations.mjs), which can be read
      # without a login.
      - run: npm run pretest
      - run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/github-annotations.mjs --test-reporter-destination=stdout
